name: Atualizar previsoes CS2

on:
  schedule:
    #Corre a cada hora, aos minutos 0. Sintaxe cron: minuto hora dia mes dia-semana
    - cron: "0 * * * *"
  workflow_dispatch:
    #Permite correr manualmente a partir do separador "Actions" no GitHub,
    #Útil para testar sem esperar pela proxima hora agendada.

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr atualizacao de previsoes
        env:
          CF_CLEARANCE: ${{ secrets.CF_CLEARANCE }}
          USER_AGENT: ${{ secrets.USER_AGENT }}
        run: python scripts/atualizar_previsoes.py

      - name: Guardar alteracoes no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/previsoes_log.csv
          git diff --staged --quiet || git commit -m "Atualizacao automatica de previsoes [skip ci]"
          git push